{% extends "base.html" %}

{% block title %}Create Account | StudyFlow{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            🎓
        </div>

        <h1>
            Create your account
        </h1>

        <p>
            Start organizing your student life.
        </p>


        <form method="POST">

            <label>
                First Name
            </label>

            <input
                type="text"
                name="firstName"
                placeholder="Nahdi"
                required
            >


            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="you@example.com"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password1"
                placeholder="Create a password"
                required
            >


            <label>
                Confirm Password
            </label>

            <input
                type="password"
                name="password2"
                placeholder="Repeat your password"
                required
            >


            <button type="submit">
                Create Account
            </button>

        </form>


        <div class="auth-footer">

            Already have an account?

            <a href="{{ url_for('auth.login') }}">
                Login
            </a>

        </div>

    </div>

</div>

{% endblock %}
