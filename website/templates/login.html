{% extends "base.html" %}

{% block title %}Login | StudyFlow{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            🎓
        </div>

        <h1>
            Welcome back
        </h1>

        <p>
            Continue your productivity journey.
        </p>


        <form method="POST">

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="you@example.com"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <div class="auth-footer">

            Don't have an account?

            <a href="{{ url_for('auth.sign_up') }}">
                Create one
            </a>

        </div>

    </div>

</div>

{% endblock %}
